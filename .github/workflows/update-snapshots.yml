name: Update visual baselines

# The visual tests compare screenshots, and fonts render differently per operating system, so the
# baselines must be recorded on the same Linux image CI uses. Run this after an intended design
# change: it records fresh screenshots and uploads them as an artifact (it commits nothing).
# Download `visual-baselines`, copy the PNGs into apps/web/e2e/visual.spec.ts-snapshots/, review
# them, and commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bun run --cwd apps/web playwright install --with-deps chromium
      - name: Build web
        run: bun run --cwd apps/web build
      - name: Record the screenshots
        run: bun run --cwd apps/web playwright test e2e/visual.spec.ts --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: apps/web/e2e/visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 7
